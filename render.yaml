services:
  - type: web
    name: deadlinepilot
    runtime: node
    plan: free
    buildCommand: npm ci && npm --prefix server ci && npm --prefix client ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        value: https://deadlinepilot.onrender.com
